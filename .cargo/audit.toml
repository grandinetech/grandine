[advisories]
ignore = [
    'RUSTSEC-2023-0071',
    'RUSTSEC-2024-0336',
    'RUSTSEC-2024-0384',
    'RUSTSEC-2024-0388',
    'RUSTSEC-2025-0009',
    'RUSTSEC-2025-0055',
    # rustls-webpki 0.101.7 comes with rustls 0.21 from zkm-sdk and sp1-sdk 6.1
    # TODO: remove this once zkm-sdk moves to rustls 0.23 and sp1-sdk can be updated past 6.1
    'RUSTSEC-2026-0098',
    'RUSTSEC-2026-0099',
    'RUSTSEC-2026-0104',
