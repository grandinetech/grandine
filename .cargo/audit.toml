    # and 0.3.27 is the last 0.3.x release, so this cannot be resolved from our side.
    # Not reachable from the node: none of these features are enabled by default.
    # TODO: remove this once zkm-sdk moves to h2 0.4 and sp1-sdk can be updated past 6.1
    'RUSTSEC-2026-0258',
    # rustls 0.20 & 0.21 come only with the optional zkVM prover backends: zkm-sdk via
    # tonic 0.8, ethers 2.0 & reqwest 0.11, and sp1-sdk 6.1 via aws-sdk-kms defaults.
    # The fixes are only in rustls >= 0.23.46.
    # TODO: remove this once zkm-sdk moves to rustls 0.23 and sp1-sdk can be updated past 6.1
    'RUSTSEC-2026-0346',
    'RUSTSEC-2026-0349',
    # zip 0.6 comes only with zkm-sdk via ethers 2.0, ethers-solc & svm-rs 0.3.
    # The fixes are only in zip >= 9.0.0. Not reachable from the node.
    # TODO: remove this once zkm-sdk drops ethers 2.0
    'RUSTSEC-2026-0367',
    'RUSTSEC-2026-0368',
    'RUSTSEC-2026-0369'
]
